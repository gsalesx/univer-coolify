server {
  listen 80;
  server_name _;

  client_max_body_size 100m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location /universer-api/comb/connect {
    proxy_pass http://universer:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location /universer-api/ {
    proxy_pass http://universer:8000;
    proxy_intercept_errors on;
    error_page 502 503 504 = @univer_api_error;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @univer_api_error {
    default_type text/plain;
    return 502 "univer api upstream error\naddr=$upstream_addr\nstatus=$upstream_status\nconnect_time=$upstream_connect_time\nresponse_time=$upstream_response_time\n";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
