<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Univer Sheets</title>
    <script type="module" crossorigin src="./assets/index-kx4u0WYz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dv08TWPC.css">
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div>
          <strong>Univer Sheets</strong>
          <span>Official open-source editor</span>
        </div>
        <small>Open-source mode</small>
      </header>

      <main id="dashboard" class="dashboard" hidden>
        <section class="dashboard-card">
          <div class="dashboard-title">
            <div>
              <h1>Planilhas</h1>
              <p>Crie uma nova planilha ou continue de onde parou.</p>
            </div>
            <div class="dashboard-actions">
              <label class="dashboard-name-field">
                <span>Nome da planilha</span>
                <input id="new-workbook-name" type="text" value="Untitled spreadsheet" />
              </label>
              <button id="create-workbook" class="primary-button" type="button">Criar nova planilha</button>
              <button id="open-upload-modal" class="secondary-button" type="button">Upload</button>
            </div>
          </div>

          <div id="workbook-list" class="workbook-list" aria-live="polite"></div>
        </section>
      </main>

      <div id="upload-modal" class="upload-modal" hidden>
        <div class="upload-dialog" role="dialog" aria-modal="true" aria-labelledby="upload-title">
          <div class="upload-dialog-header">
            <h2 id="upload-title">Upload de arquivo</h2>
            <button id="close-upload-modal" class="icon-button" type="button" aria-label="Fechar">×</button>
          </div>

          <div class="upload-tabs" aria-hidden="true">
            <span class="upload-tab upload-tab--active">Escolha seu arquivo</span>
            <span class="upload-tab">Importar da URL</span>
          </div>

          <label class="upload-name-field">
            <span>Nome da planilha</span>
            <input id="upload-workbook-name" type="text" placeholder="Nome da planilha" />
          </label>

          <label id="upload-dropzone" class="upload-dropzone" for="workbook-upload-input">
            <input id="workbook-upload-input" type="file" accept=".xls,.xlsx" hidden />
            <strong>Busque (ou) arraste seu arquivo</strong>
            <span>Os formatos compatíveis são .xls e .xlsx.</span>
            <small>Tamanho máximo recomendado: 50 MB.</small>
            <em id="upload-file-name"></em>
          </label>

          <div class="upload-dialog-actions">
            <button id="submit-upload" class="primary-button" type="button" disabled>Upload</button>
            <button id="cancel-upload" class="secondary-button" type="button">Cancelar</button>
          </div>
        </div>
      </div>

      <section class="quick-toolbar" aria-label="Quick fill colors">
        <button class="quick-color" type="button" data-fill-color="#93c5fd">
          <span>Etiqueta</span>
          <i class="quick-color-dot quick-color-dot--blue"></i>
        </button>
        <button class="quick-color" type="button" data-fill-color="#fde047">
          <span>Faltando</span>
          <i class="quick-color-dot quick-color-dot--yellow"></i>
        </button>
        <button class="quick-color" type="button" data-fill-color="#86efac">
          <span>Correto</span>
          <i class="quick-color-dot quick-color-dot--green"></i>
        </button>
        <button class="quick-color" type="button" data-fill-color="#c084fc">
          <span>Conjuntos</span>
          <i class="quick-color-dot quick-color-dot--purple"></i>
        </button>
      </section>

      <div id="univer"></div>
    </div>

  </body>
</html>
